<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="单位转换">
<meta name="theme-color" content="#0f172a">
<title>单位转换</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #111827; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --accent-soft: #e8efff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8;
      --line: #334155; --accent: #60a5fa; --accent-soft: #1e3a5f;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif; }
  body {
    padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px)
             calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 16px);
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 4px 0 16px; font-weight: 700; }

  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    background: var(--line); padding: 4px; border-radius: 12px; margin-bottom: 16px; }
  .tab { border: 0; background: transparent; color: var(--muted); font-size: 15px;
    font-weight: 600; padding: 10px 2px; border-radius: 9px; cursor: pointer; }
  .tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .panel { display: none; }
  .panel.active { display: block; }

  .row { display: flex; align-items: center; gap: 8px;
    border: 1.5px solid var(--line); border-radius: 12px; padding: 4px 6px 4px 12px; }
  .row:focus-within { border-color: var(--accent); }
  .row input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    color: var(--text); font-size: 30px; font-weight: 600; padding: 8px 0; font-variant-numeric: tabular-nums; }
  .sign { flex: none; border: 0; background: var(--accent-soft); color: var(--accent); font-size: 18px;
    font-weight: 700; width: 40px; height: 36px; border-radius: 8px; cursor: pointer; }
  .pick { position: relative; flex: none; }
  .pick select { -webkit-appearance: none; appearance: none; border: 0; outline: 0;
    background: var(--accent-soft); color: var(--accent); font-size: 17px; font-weight: 700;
    padding: 10px 28px 10px 12px; border-radius: 10px; cursor: pointer; font-family: inherit; }
  .pick::after { content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    color: var(--accent); font-size: 13px; pointer-events: none; }

  .swap { display: block; margin: 8px auto; border: 0; background: transparent; color: var(--muted);
    font-size: 22px; width: 44px; height: 32px; border-radius: 8px; cursor: pointer; }
  .swap:active { background: var(--accent-soft); color: var(--accent); }

  .toggle { display: flex; gap: 6px; margin-bottom: 14px; }
  .toggle button { flex: 1; border: 1.5px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 10px; padding: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .toggle button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 9px 4px; border-bottom: 1px solid var(--line); font-size: 15px; }
  tr:last-child td { border-bottom: 0; }
  td:last-child { text-align: right; color: var(--muted); white-space: nowrap; }
  tr.tap { cursor: pointer; }
  tr.tap:active td { background: var(--accent-soft); }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>单位转换</h1>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>

<script>
(function () {
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  function parse(s) {
    s = String(s).trim().replace(/,/g, '.').replace(/[−–—]/g, '-');
    if (s === '' || s === '-' || s === '.' || s === '-.') return null;
    var n = Number(s);
    return isFinite(n) ? n : null;
  }
  function fmt(n, fixed) {
    if (n === null || n === undefined) return '';
    var a = Math.abs(n);
    var d = fixed != null ? fixed : a >= 100 ? 1 : a >= 1 ? 2 : a >= 0.01 ? 3 : 4;
    var r = Number(n.toFixed(d));
    if (Object.is(r, -0)) r = 0;
    return String(r);
  }
  function lin(f) { return { to: function (v) { return v * f; }, from: function (b) { return b / f; } }; }

  // 容量：美制 / 英制
  var std = store.get('uc-std') === 'uk' ? 'uk' : 'us';
  var VOL = {
    us: { floz: 29.5735295625, qt: 946.352946, gal: 3785.411784 },
    uk: { floz: 28.4130625, qt: 1136.5225, gal: 4546.09 }
  };

  var CATS = [
    { id: 'temp', tab: '🌡️ 温度', sign: true, fixed: 1, def: ['C', 'F'],
      units: [['C', '°C', '摄氏度'], ['F', '°F', '华氏度']],
      conv: function () { return {
        C: { to: function (v) { return v; }, from: function (b) { return b; } },
        F: { to: function (v) { return (v - 32) * 5 / 9; }, from: function (b) { return b * 9 / 5 + 32; } }
      }; },
      refs: [['C', 0, '结冰'], ['C', 10], ['C', 20, '室温'], ['C', 25], ['C', 30], ['C', 37, '体温'],
             ['C', 38, '发烧'], ['C', 100, '沸水'], ['F', 350, '烤箱'], ['F', 400, '烤箱']],
      other: { C: 'F', F: 'C' },
      note: function () { return '°F = °C × 9/5 + 32'; } },

    { id: 'len', tab: '📏 长度', def: ['in', 'cm'],
      units: [['in', 'in', '英寸'], ['ft', 'ft', '英尺'], ['cm', 'cm', '厘米'], ['m', 'm', '米']],
      conv: function () { return { in: lin(2.54), ft: lin(30.48), cm: lin(1), m: lin(100) }; },
      refs: [['in', 1], ['in', 6], ['ft', 1, '= 12 in'], ['in', 24], ['in', 27, '显示器'],
             ['in', 55, '电视'], ['in', 66, '5 ft 6 in 身高']],
      other: { in: 'cm', ft: 'cm', cm: 'in', m: 'ft' },
      note: function () { return '1 in = 2.54 cm（精确值）；1 ft = 12 in = 30.48 cm'; } },

    { id: 'vol', tab: '🥤 容量', def: ['floz', 'ml'], toggle: true,
      units: [['ml', 'ml', '毫升'], ['L', 'L', '升'], ['floz', 'fl oz', '液量盎司'], ['qt', 'qt', '夸脱'], ['gal', 'gal', '加仑']],
      conv: function () { var v = VOL[std]; return { ml: lin(1), L: lin(1000), floz: lin(v.floz), qt: lin(v.qt), gal: lin(v.gal) }; },
      refs: [['floz', 1], ['floz', 1.6, '1 个大鸡蛋液（约）', 'us'], ['floz', 8], ['floz', 12, '罐装汽水', 'us'],
             ['floz', 16.9, '一瓶矿泉水', 'us'], ['qt', 1], ['gal', 1], ['L', 1]],
      other: { ml: 'floz', L: 'qt', floz: 'ml', qt: 'ml', gal: 'L' },
      note: function () { return std === 'us'
        ? '美制：1 fl oz ≈ 29.57 ml；1 qt = 32 fl oz ≈ 946 ml；1 gal = 4 qt ≈ 3.785 L（美国商品标签用这个）'
        : '英制：1 fl oz ≈ 28.41 ml；1 qt = 40 fl oz ≈ 1137 ml；1 gal = 4 qt ≈ 4.546 L'; } },

    { id: 'wt', tab: '⚖️ 重量', def: ['lb', 'kg'],
      units: [['g', 'g', '克'], ['kg', 'kg', '公斤'], ['oz', 'oz', '盎司'], ['lb', 'lb', '磅']],
      conv: function () { return { g: lin(1), kg: lin(1000), oz: lin(28.349523125), lb: lin(453.59237) }; },
      refs: [['oz', 1], ['oz', 2, '1 个大鸡蛋（带壳，约）'], ['oz', 8], ['oz', 16, '= 1 lb'],
             ['g', 500, '一瓶矿泉水（只算水）'], ['lb', 1], ['lb', 5], ['lb', 50, '托运行李'], ['lb', 150, '体重']],
      other: { g: 'oz', kg: 'lb', oz: 'g', lb: 'kg' },
      note: function () { return '1 lb = 16 oz = 453.59 g。重量的 oz 和液体的 fl oz 不是同一个单位。鸡蛋按美国 Large 规格估算。'; } }
  ];

  function sym(c, u) { for (var i = 0; i < c.units.length; i++) if (c.units[i][0] === u) return c.units[i][1]; return u; }
  function convert(c, v, from, to) { var m = c.conv(); return m[to].from(m[from].to(v)); }

  var tabsEl = document.getElementById('tabs'), panelsEl = document.getElementById('panels');

  CATS.forEach(function (c) {
    // 记住每个类别选过的单位
    var saved = (store.get('uc-u-' + c.id) || '').split('|');
    var valid = function (u) { return c.units.some(function (x) { return x[0] === u; }); };
    c.sel = (saved.length === 2 && valid(saved[0]) && valid(saved[1])) ? saved : c.def.slice();

    var tab = el('button', 'tab', c.tab); tab.dataset.tab = c.id; tabsEl.appendChild(tab);
    var panel = el('section', 'panel'); panel.id = c.id; panelsEl.appendChild(panel);

    if (c.toggle) {
      var tg = el('div', 'toggle');
      [['us', '美制 US'], ['uk', '英制 UK']].forEach(function (s) {
        var b = el('button', '', s[1]); b.dataset.std = s[0]; tg.appendChild(b);
        b.addEventListener('click', function () { std = s[0]; store.set('uc-std', std); renderToggle(); recalc(1, 0); renderRefs(); });
      });
      panel.appendChild(tg);
      c.renderToggle = function () { tg.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.std === std); }); };
    }
    function renderToggle() { if (c.renderToggle) c.renderToggle(); }

    var card = el('div', 'card'); panel.appendChild(card);
    var inputs = [], selects = [];
    [0, 1].forEach(function (i) {
      var row = el('div', 'row');
      var inp = el('input'); inp.type = 'text'; inp.inputMode = 'decimal'; inp.placeholder = '0'; inp.autocomplete = 'off';
      if (c.sign) {
        var sb = el('button', 'sign', '±'); sb.setAttribute('aria-label', '正负号');
        sb.addEventListener('click', function () {
          var s = inp.value.trim(); inp.value = s.charAt(0) === '-' ? s.slice(1) : '-' + s; recalc(1 - i, i);
        });
        row.appendChild(sb);
      }
      row.appendChild(inp);
      var pick = el('span', 'pick'), sel = el('select');
      c.units.forEach(function (u) { var o = el('option', '', u[1] + ' ' + u[2]); o.value = u[0]; sel.appendChild(o); });
      sel.value = c.sel[i];
      pick.appendChild(sel); row.appendChild(pick);
      card.appendChild(row);
      inp.addEventListener('input', function () { recalc(1 - i, i); });
      sel.addEventListener('change', function () { c.sel[i] = sel.value; save(); recalc(i, 1 - i); });
      inputs.push(inp); selects.push(sel);
      if (i === 0) {
        var sw = el('button', 'swap', '⇅'); sw.setAttribute('aria-label', '交换单位');
        sw.addEventListener('click', function () {
          c.sel.reverse(); selects[0].value = c.sel[0]; selects[1].value = c.sel[1];
          var t = inputs[0].value; inputs[0].value = inputs[1].value; inputs[1].value = t; save();
        });
        card.appendChild(sw);
      }
    });

    function save() { store.set('uc-u-' + c.id, c.sel.join('|')); }
    // 用 src 行的数字算出 dst 行
    function recalc(dst, src) {
      var v = parse(inputs[src].value);
      inputs[dst].value = v === null ? '' : fmt(convert(c, v, c.sel[src], c.sel[dst]), c.fixed);
    }

    var refCard = el('div', 'card'); panel.appendChild(refCard);
    refCard.appendChild(el('h2', '', '常用参考（点一下填入）'));
    var table = el('table'); refCard.appendChild(table);
    var note = el('div', 'note'); refCard.appendChild(note);

    function renderRefs() {
      table.innerHTML = '';
      c.refs.forEach(function (r) {
        if (r[3] && r[3] !== std) return;
        var u = r[0], v = r[1], o = c.other[u];
        var tr = el('tr', 'tap');
        tr.appendChild(el('td', '', v + ' ' + sym(c, u) + (r[2] ? ' ' + r[2] : '')));
        tr.appendChild(el('td', '', fmt(convert(c, v, u, o), c.fixed) + ' ' + sym(c, o)));
        tr.addEventListener('click', function () {
          c.sel = [u, o]; selects[0].value = u; selects[1].value = o; save();
          inputs[0].value = String(v); recalc(1, 0);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        table.appendChild(tr);
      });
      note.textContent = c.note();
    }
    renderToggle(); renderRefs();
  });

  function show(id) {
    if (!document.getElementById(id)) id = 'temp';
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === id); });
    document.querySelectorAll('.panel').forEach(function (p) { p.classList.toggle('active', p.id === id); });
    store.set('uc-tab', id);
  }
  tabsEl.addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) show(b.dataset.tab); });
  show(store.get('uc-tab') || 'temp');
})();
</script>
</body>
</html>
